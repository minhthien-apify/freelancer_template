<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="Cost Estimate and Order Form" />
    <meta
      name="description"
      content="Request a cost estimate and place an order through this contact and project form."
    />
    <meta name="author" content="Your Business Name" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cost Estimate and Order Form" />
    <meta
      property="og:description"
      content="Request a cost estimate and place an order through this contact and project form."
    />
    <meta property="og:site_name" content="Your Business Name" />
    <title>Cost Estimate and Order Form</title>
    <style>
      main {
        display: flex;
        align-items: flex-start;
      }

      #contact-form-qxptb2 {
        box-sizing: border-box;
        flex: 0 0 65%;
        width: 65%;
      }

      #dynamic-floating-item {
        box-sizing: border-box;
        display: flex;
        flex: 0 0 calc(35% - 16px);
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        width: calc(35% - 16px);
        margin: 8px;
        padding: 12px 24px;
        background-color: #10b981;
        color: #fff;
        font-family: sans-serif;
      }

      #dynamic-floating-item button {
        padding: 8px 16px;
        border: 0;
        border-radius: 4px;
        background-color: #fff;
        color: #047857;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
      }

      #search-store-button:hover,
      #search-store-button:focus-visible,
      #submit-form-button:hover,
      #submit-form-button:focus-visible {
        background-color: #2563eb;
        color: #fff;
      }

      #store-query {
        box-sizing: border-box;
        width: 100%;
        padding: 8px;
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 4px;
        font: inherit;
      }

      #store-results {
        max-height: 320px;
        overflow: auto;
        padding-left: 20px;
      }

      #store-results li + li {
        margin-top: 12px;
      }

      @media (max-width: 480px) {
        main {
          flex-direction: column;
        }

        #contact-form-qxptb2 {
          flex-basis: auto;
          width: 100%;
        }

        #dynamic-floating-item {
          flex-basis: auto;
          width: calc(100% - 16px);
          padding: 10px 12px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <iframe
        id="contact-form-qxptb2"
        title="Cost estimate and order form"
        style="border: none; min-height: 1200px"
        src="https://clientform.duckdns.org/forms/contact-form-qxptb2"
        loading="lazy"
      ></iframe>
      <div id="dynamic-floating-item">
        <span id="floating-status" role="status" aria-live="polite">
          Estimated total: $0.00
        </span>
        <button id="submit-form-button" type="button">Submit form</button>

        <hr
          style="
            align-self: stretch;
            color: inherit;
            box-sizing: border-box;
            width: 100%;
            height: 14px;
            background-image:
              radial-gradient(
                circle at 50% 50%,
                currentColor 0 1px,
                transparent 1.5px
              ),
              radial-gradient(
                circle at 50% 18%,
                currentColor 0 2px,
                transparent 2.5px
              ),
              radial-gradient(
                circle at 50% 82%,
                currentColor 0 2px,
                transparent 2.5px
              ),
              radial-gradient(
                circle at 20% 50%,
                currentColor 0 2px,
                transparent 2.5px
              ),
              radial-gradient(
                circle at 80% 50%,
                currentColor 0 2px,
                transparent 2.5px
              );
            background-size: 18px 14px;
            background-repeat: repeat-x;
            border: 0;
          "
        />
        <br />

        <!-- <hr> -->
        <label for="store-query"
          >Search the Apify API for automation tasks</label
        >
        <input
          id="store-query"
          type="search"
          maxlength="200"
          placeholder="E.x: youtube, tiktok"
        />
        <button id="search-store-button" type="button">Search</button>
        <span id="search-status" role="status" aria-live="polite"></span>
        <ul id="store-results"></ul>
      </div>
    </main>

    <script src="https://opnform.com/widgets/opnform-sdk.min.js"></script>
    <script>
      opnform.on("submit", function (data) {
        console.log("Form submitted:", data);
      });

      opnform.on("pageChange", (event) => {
        const floatingStatus = document.getElementById("floating-status");
        console.log("detected page cahnge");

        if (event.currentPage === 1) {
          floatingStatus.textContent = "Page 1: Filling out basics...";
        } else if (event.currentPage === 2) {
          floatingStatus.textContent = "Almost done! Page 2...";
        }
      });

      const formSlug = "contact-form-qxptb2";
      const floatingElement = document.getElementById("dynamic-floating-item");
      const currencyFormatter = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
      });

      const searchButton = document.getElementById("search-store-button");
      const searchInput = document.getElementById("store-query");
      const searchStatus = document.getElementById("search-status");
      const searchResults = document.getElementById("store-results");

      searchButton.addEventListener("click", async () => {
        const query = searchInput.value.trim();
        if (!query) {
          searchStatus.textContent = "Enter a search query.";
          return;
        }

        searchButton.disabled = true;
        searchStatus.textContent = "Searching...";
        searchResults.replaceChildren();

        try {
          const response = await fetch("http://localhost:5999/api/scrape", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Search failed.");
          }

          for (const result of data.results) {
            const item = document.createElement("li");
            const resultHeading = document.createElement("div");
            resultHeading.style.display = "flex";
            resultHeading.style.alignItems = "center";
            resultHeading.style.gap = "8px";
            const actorUrl = `https://apify.com/${encodeURIComponent(
              result.username,
            )}/${encodeURIComponent(result.name)}?fpr=2tkyk9`;
            const imageLink = document.createElement("a");
            imageLink.href = actorUrl;
            imageLink.target = "_blank";
            imageLink.rel = "noopener noreferrer";
            const image = document.createElement("img");
            image.src = result.pictureUrl;
            image.alt = result.title || result.name || "Apify actor";
            image.width = 20;
            image.height = 20;
            image.style.display = "block";
            imageLink.append(image);
            resultHeading.append(imageLink);

            const title = document.createElement("strong");
            const titleLink = document.createElement("a");
            titleLink.href = actorUrl;
            titleLink.target = "_blank";
            titleLink.rel = "noopener noreferrer";
            titleLink.textContent =
              result.title || result.name || "Untitled actor";
            title.append(titleLink);
            resultHeading.append(title);
            item.append(resultHeading);
            // if (result.username) {
            //   item.append(document.createTextNode(` by ${result.username}`));
            // }
            if (result.description) {
              const description = document.createElement("div");
              description.style.marginTop = "8px";
              description.textContent = result.description;
              item.append(description);
            }
            searchResults.append(item);
          }

          const storeLink = document.createElement("a");
          storeLink.href = "https://apify.com/store?fpr=2tkyk9";
          storeLink.target = "_blank";
          storeLink.rel = "noopener noreferrer";
          storeLink.textContent = "Apify Store";
          searchStatus.replaceChildren(
            document.createTextNode(
              `${data.results.length} result(s) found. Find out more from `,
            ),
            storeLink,
            document.createTextNode("."),
          );
        } catch (error) {
          searchStatus.textContent = error.message;
        } finally {
          searchButton.disabled = false;
        }
      });

      function updateEstimatedTotal() {
        const form = opnform.get(formSlug);
        if (!form) return;
      }

      opnform.on("ready", updateEstimatedTotal);
      opnform.on("dataChange", (data) => {
        console.log("Form data changed:", data);
        updateEstimatedTotal();
      });

      document
        .getElementById("submit-form-button")
        // .addEventListener("click", async () => {
        .addEventListener("click", async () => {
          const form = opnform.get(formSlug);
          if (!form) {
            console.error(`Unable to find OpnForm form "${formSlug}".`);
            return;
          }
          const approvalFieldId = "d9e4aa98-8542-4830-807a-7a190618e184";

          try {
            await form.setField(approvalFieldId, "Approved");
            await form.submit();
          } catch (error) {
            console.error("Form submission failed:", error);
          } finally {
            await form.setField(approvalFieldId, "");
          }
        });
    </script>
  </body>
</html>
