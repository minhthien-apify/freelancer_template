<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="Cost Estimate and Order Form" />
    <meta
      name="description"
      content="Request a cost estimate and place an order through this contact and project form."
    />
    <meta name="author" content="Your Business Name" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cost Estimate and Order Form" />
    <meta
      property="og:description"
      content="Request a cost estimate and place an order through this contact and project form."
    />
    <meta property="og:site_name" content="Your Business Name" />
    <title>Cost Estimate and Order Form</title>
    <style>
      #dynamic-floating-item {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 999999;
        padding: 12px 24px;
        border-radius: 8px;
        background-color: #10b981;
        color: #fff;
        font-family: sans-serif;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      @media (max-width: 480px) {
        #dynamic-floating-item {
          right: 12px;
          bottom: 12px;
          padding: 10px 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <iframe
        id="cost-estimate-and-order-form-jgsebk"
        title="Cost estimate and order form"
        style="border: none; width: 100%; min-height: 1200px"
        src="https://opnform.com/forms/cost-estimate-and-order-form-jgsebk"
        loading="lazy"
      ></iframe>
    </main>
    <div id="dynamic-floating-item" role="status" aria-live="polite">
      Form started!
    </div>

    <script src="https://opnform.com/widgets/opnform-sdk.min.js"></script>
    <script>
      opnform.on("page-change", (event) => {
        const floatingElement = document.getElementById(
          "dynamic-floating-item",
        );

        if (event.currentPage === 1) {
          floatingElement.textContent = "Page 1: Filling out basics...";
        } else if (event.currentPage === 2) {
          floatingElement.textContent = "Almost done! Page 2...";
        }
      });
    </script>
  </body>
</html>
